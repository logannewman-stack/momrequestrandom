<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InnerBoard OS — What it costs to install, what you get back</title>
    <meta
      name="description"
      content="The internal installation of self leadership. What it costs to install across your team, and what published research says you get back."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ece8dd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23141310'/><path d='M8 22V10h3.4l4.6 7.2L20.6 10H24v12h-3v-6.6l-3.6 5.6h-2.8L11 15.4V22z' fill='%235c7c99'/></svg>" />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Applied before first paint so the correct theme is never repainted.
      try {
        var t = localStorage.getItem('ib-theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
